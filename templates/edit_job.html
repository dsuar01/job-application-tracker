{% extends "base.html" %}

{% block title %}Edit Job{% endblock %}

{% block content %}
    <h2>Edit Job</h2>

    <form method="POST" action="{{ url_for('edit_job', job_id=job.job_id) }}">
        <p>
            <label for="company_id">Company:</label><br>
            <select id="company_id" name="company_id" required>
                {% for company in companies %}
                    <option value="{{ company.company_id }}"
                        {% if company.company_id == job.company_id %}selected{% endif %}>
                        {{ company.company_name }}
                    </option>
                {% endfor %}
            </select>
        </p>

        <p>
            <label for="job_title">Job Title:</label><br>
            <input type="text" id="job_title" name="job_title" value="{{ job.job_title }}" required>
        </p>

        <p>
            <label for="job_type">Job Type:</label><br>
            <select id="job_type" name="job_type">
                <option value="Full-time" {% if job.job_type == "Full-time" %}selected{% endif %}>Full-time</option>
                <option value="Part-time" {% if job.job_type == "Part-time" %}selected{% endif %}>Part-time</option>
                <option value="Contract" {% if job.job_type == "Contract" %}selected{% endif %}>Contract</option>
                <option value="Internship" {% if job.job_type == "Internship" %}selected{% endif %}>Internship</option>
            </select>
        </p>

        <p>
            <label for="salary_min">Salary Min:</label><br>
            <input type="number" id="salary_min" name="salary_min" step="0.01" value="{{ job.salary_min }}">
        </p>

        <p>
            <label for="salary_max">Salary Max:</label><br>
            <input type="number" id="salary_max" name="salary_max" step="0.01" value="{{ job.salary_max }}">
        </p>

        <p>
            <label for="date_posted">Date Posted:</label><br>
            <input type="date" id="date_posted" name="date_posted" value="{{ job.date_posted }}">
        </p>

        <button type="submit">Update Job</button>
    </form>
{% endblock %}
