{% macro delete_button(action, what) %}
<form method="POST" action="{{ action }}"
      onsubmit="return confirm('Delete this {{ what }}? This cannot be undone.');">
    <button type="submit" class="danger small">Delete</button>
</form>
{% endmacro %}

{% macro empty(title, text, link, link_text) %}
<div class="card empty">
    <h3>{{ title }}</h3>
    <p>{{ text }}</p>
    <a class="btn" href="{{ link }}">{{ link_text }}</a>
</div>
{% endmacro %}

{% macro status_badge(status) %}
<span class="badge {{ status | status_class }}">{{ status }}</span>
{% endmacro %}
