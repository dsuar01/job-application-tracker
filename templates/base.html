<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %} · Job Application Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% set ep = request.endpoint or '' %}
    <header class="topbar">
        <div class="container">
            <a class="brand" href="{{ url_for('dashboard') }}">
                <span class="brand-mark">JT</span> Job Tracker
            </a>
            <nav aria-label="Main">
                <a href="{{ url_for('dashboard') }}" class="{{ 'active' if ep == 'dashboard' }}">Dashboard</a>
                <a href="{{ url_for('applications') }}" class="{{ 'active' if 'application' in ep }}">Applications</a>
                <a href="{{ url_for('jobs') }}" class="{{ 'active' if '_job' in ep or ep == 'jobs' }}">Jobs</a>
                <a href="{{ url_for('companies') }}" class="{{ 'active' if 'compan' in ep }}">Companies</a>
                <a href="{{ url_for('contacts') }}" class="{{ 'active' if 'contact' in ep }}">Contacts</a>
                <a href="{{ url_for('job_match') }}" class="{{ 'active' if ep == 'job_match' }}">Job Match</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}" role="status">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
